[package]
name = "my_music_player"
version = "0.1.0"
edition = "2024"

[lib]
name = "my_music_player"
path = "src/lib.rs"

[[bin]]
name = "my_music_player"
path = "src/main.rs"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
symphonia = { version = "0.6.1", features = ["flac", "mp3", "wav"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7.20", features = ["io"] }
tower-http = { version = "0.7.1", features = ["fs", "cors"] }
walkdir = "2.5.0"

[target.'cfg(not(target_os = "android"))'.dependencies]
open = "5.4.5"
rfd = "0.15"
rodio = { version = "0.23.0", features = ["flac", "mp3", "wav"] }
reqwest = { version = "0.12", default-features = true, features = ["stream", "json"] }

[target.'cfg(target_os = "android")'.dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream", "json"] }

[profile.dev]
opt-level = 2
