name: Build MyMusic Apps (Android APK)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Tauri CLI (Native Standalone Binary)
        run: |
          curl -L --proto '=https' --tlsv1.2 -sSf https://raw.githubusercontent.com/cargo-bins/cargo-binstall/main/install-from-binstall-release.sh | bash
          cargo binstall tauri-cli --no-confirm

      - name: Configure Android SDK & NDK Environment
        run: |
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          echo "Detected NDK at: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses & Ensure Platforms
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true
          sdkmanager "platforms;android-34" "build-tools;34.0.0" || true

      - name: Initialize Tauri Android & Configure AndroidManifest
        run: |
          cd src-tauri
          if [ ! -d "gen/android" ]; then
            echo "Scaffolding Android native project..."
            cargo tauri android init --ci
          fi
          if [ -f "gen/android/gradlew" ]; then
            chmod +x gen/android/gradlew
          fi

          MANIFEST="gen/android/app/src/main/AndroidManifest.xml"
          if [ -f "$MANIFEST" ]; then
            echo "Injecting Android permissions and enabling cleartext traffic..."
            # Enable cleartext traffic for local Axum server communication
            sed -i 's/<application/<application android:usesCleartextTraffic="true"/' "$MANIFEST"
            # Ensure Internet, Storage and Audio permissions
            sed -i '/<\/manifest>/i \    <uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />\n    <uses-permission android:name="android.permission.READ_MEDIA_AUDIO" />\n    <uses-permission android:name="android.permission.READ_EXTERNAL_STORAGE" android:maxSdkVersion="32" />' "$MANIFEST"
            echo "=== Updated AndroidManifest.xml ==="
            cat "$MANIFEST" | head -n 35
          fi

      - name: Build Android APK
        run: |
          cd src-tauri
          echo "Building APK for aarch64 (debug-signed)..."
          set +e
          cargo tauri android build --apk --debug --target aarch64 --ci > ../build.log 2>&1
          BUILD_STATUS=$?
          if [ $BUILD_STATUS -ne 0 ]; then
            echo "❌ cargo tauri android build failed with exit code $BUILD_STATUS"
            echo "### ⚠️ Build Failure Logs" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 60 ../build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 30 ../build.log | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit $BUILD_STATUS
          fi

      - name: Upload Build Log Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tauri-build-log
          path: build.log

      - name: Locate, Verify & Package APK
        if: success()
        run: |
          mkdir -p dist
          echo "=== All APK files generated ==="
          find . -name "*.apk" -ls
          
          APK_RAW=$(find . -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$APK_RAW" ] && [ -f "$APK_RAW" ]; then
            echo "✅ Target APK found: $APK_RAW"
            cp "$APK_RAW" dist/MyMusic.apk
            ls -lh dist/MyMusic.apk
            echo "### 🎵 MyMusic Android APK Build Complete!" >> $GITHUB_STEP_SUMMARY
            echo "File: \`MyMusic.apk\` ($(du -h dist/MyMusic.apk | cut -f1))" >> $GITHUB_STEP_SUMMARY
            echo "Ready for direct install on Android devices (ARM64)." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No APK binary found in workspace."
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-APK
          path: dist/MyMusic.apk
          if-no-files-found: error

      - name: Publish Public GitHub Release
        uses: softprops/action-gh-release@v2
        if: success()
        with:
          tag_name: v1.0.1
          name: "MyMusic Hi-Res v1.0.1 (Hotfix Update)"
          draft: false
          prerelease: false
          make_latest: true
          body: |
            ## 🎵 MyMusic Hi-Res - Audiophile Player v1.0.1 (Bản vá lỗi Android)

            ### 📱 Tải về trực tiếp cho Android (Không cần tài khoản GitHub):
            Bấm trực tiếp vào file **`MyMusic.apk`** bên dưới phần **Assets** để tải và cài đặt ngay lên điện thoại.

            ### 🚀 Bản vá v1.0.1:
            - **Khắc phục lỗi quét Google Drive trên Android:** Thay thế toàn diện cơ chế gọi process `curl.exe` bằng HTTP Client native Rust (`reqwest` + `rustls-tls`), quét và stream trực tiếp không phụ thuộc hệ điều hành.
            - **Khắc phục lỗi giao diện:** 
              - Nâng vị trí thanh thông báo (Toast) lên đỉnh màn hình, không còn che khuất các nút bấm hoặc modal Google Drive.
              - Căn chỉnh thanh điều hướng dưới đáy (`bottom-nav`) tương thích chuẩn thanh vuốt cử chỉ Android Gesture Navigation Bar (`env(safe-area-inset-bottom)`).
              - Sửa lỗi thanh chip phân loại (Hi-Res, Google Drive...) không bị cắt chữ.
              - Tự động ẩn nút "Phát tất cả ( 0 )" khi thư viện chưa có nhạc và hiển thị thẻ hướng dẫn thêm nhạc thân thiện.
            - **Cấp quyền mạng & bộ nhớ Android:** Bật `usesCleartextTraffic` và quyền `READ_MEDIA_AUDIO`, `INTERNET`.
          files: |
            dist/MyMusic.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
