name: Build MyMusic Apps (Android APK)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Accept Android Licenses & Setup Environment
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Initialize and Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          CI: "true"
        run: |
          set -e
          # Detect NDK 26 LTS
          export NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/26* 2>/dev/null | head -n 1)
          if [ -z "$NDK_HOME" ]; then
            export NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n 1)
          fi
          export ANDROID_NDK_ROOT=$NDK_HOME
          export ANDROID_NDK_HOME=$NDK_HOME
          echo "Selected Android NDK: $NDK_HOME"
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          # Run from repository root
          if [ ! -d "src-tauri/gen/android" ]; then
            echo "Initializing Tauri Android project..."
            tauri android init --ci
          fi

          echo "Building Android APK (target: aarch64, debug-signed for direct phone install)..."
          tauri android build --apk --debug --target aarch64 --ci

      - name: Locate, Verify & Package APK
        run: |
          mkdir -p dist
          echo "=== Searching for generated APK files ==="
          find . -name "*.apk" -ls
          
          APK_RAW=$(find . -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$APK_RAW" ] && [ -f "$APK_RAW" ]; then
            echo "✅ Target APK found: $APK_RAW"
            cp "$APK_RAW" dist/MyMusic.apk
            ls -lh dist/MyMusic.apk
            echo "### 🎵 MyMusic Android APK Build Complete!" >> $GITHUB_STEP_SUMMARY
            echo "File: \`MyMusic.apk\` ($(du -h dist/MyMusic.apk | cut -f1))" >> $GITHUB_STEP_SUMMARY
            echo "Directly installable on any modern Android device (ARM64)." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No APK binary found in workspace."
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-APK
          path: dist/MyMusic.apk
          if-no-files-found: error
