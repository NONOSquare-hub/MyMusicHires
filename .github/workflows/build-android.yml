name: Build MyMusic Apps (Android APK)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Initialize and Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          # Detect pre-installed NDK
          export NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          export ANDROID_NDK_ROOT=$NDK_HOME
          echo "Using Android NDK: $NDK_HOME"
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          cd src-tauri
          if [ ! -d "gen/android" ]; then
            tauri android init
          fi
          tauri android build --apk --target aarch64

      - name: Sign & Package APK
        run: |
          mkdir -p dist
          APK_RAW=$(find src-tauri/gen/android -name "*.apk" | head -n 1)
          if [ -z "$APK_RAW" ]; then
            echo "❌ No APK binary found!"
            exit 1
          fi
          echo "Found generated APK: $APK_RAW"

          # Generate release keystore
          keytool -genkeypair -v -keystore release.jks -alias mymusic -keyalg RSA -keysize 2048 -validity 10000 -storepass 123456 -keypass 123456 -dname "CN=MyMusic, OU=Audiophile, O=MyMusic, C=VN"

          # Find apksigner
          APKSIGNER=$(find /usr/local/lib/android/sdk/build-tools -name "apksigner" | sort -V | tail -n 1)
          echo "Using apksigner at: $APKSIGNER"

          # Sign APK
          $APKSIGNER sign --ks release.jks --ks-pass pass:123456 --key-pass pass:123456 --out dist/MyMusic.apk "$APK_RAW"
          $APKSIGNER verify dist/MyMusic.apk
          echo "✅ Successfully signed dist/MyMusic.apk"
          ls -lh dist/MyMusic.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-APK
          path: dist/MyMusic.apk
          if-no-files-found: error
