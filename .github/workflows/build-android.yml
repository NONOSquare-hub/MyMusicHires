name: Build MyMusic Apps (Android APK)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Configure Android Environment & NDK
        run: |
          # Detect NDK directory
          NDK_DIR=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | sort -V | tail -n 1)
          echo "Detected NDK at: $NDK_DIR"
          echo "NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> $GITHUB_ENV
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          echo "/usr/local/lib/android/sdk/cmdline-tools/latest/bin" >> $GITHUB_PATH
          echo "/usr/local/lib/android/sdk/platform-tools" >> $GITHUB_PATH

      - name: Accept Android Licenses
        run: |
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses || true

      - name: Build Android via Tauri Action
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          mobile: android
          args: --apk --debug --target aarch64

      - name: Locate, Verify & Package APK
        if: always()
        run: |
          mkdir -p dist
          echo "=== Searching for all generated APK files ==="
          find . -name "*.apk" -ls
          
          APK_RAW=$(find . -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$APK_RAW" ] && [ -f "$APK_RAW" ]; then
            echo "✅ Target APK found: $APK_RAW"
            cp "$APK_RAW" dist/MyMusic.apk
            ls -lh dist/MyMusic.apk
            echo "### 🎵 MyMusic Android APK Build Complete!" >> $GITHUB_STEP_SUMMARY
            echo "File: \`MyMusic.apk\` ($(du -h dist/MyMusic.apk | cut -f1))" >> $GITHUB_STEP_SUMMARY
            echo "Ready for direct install on Android devices (ARM64)." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No APK binary found in workspace."
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-APK
          path: dist/MyMusic.apk
          if-no-files-found: error
