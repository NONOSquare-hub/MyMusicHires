name: Build MyMusic Apps (Android APK)

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Rust Stable Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install Tauri CLI
        run: npm install -g @tauri-apps/cli@2

      - name: Initialize and Build Android APK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
          CI: "true"
        run: |
          set -e
          # Detect NDK 26.x (LTS) or latest available
          export NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/26* 2>/dev/null | head -n 1)
          if [ -z "$NDK_HOME" ]; then
            export NDK_HOME=$(ls -d /usr/local/lib/android/sdk/ndk/* 2>/dev/null | tail -n 1)
          fi
          export ANDROID_NDK_ROOT=$NDK_HOME
          export ANDROID_NDK_HOME=$NDK_HOME
          echo "Selected Android NDK: $NDK_HOME"
          export PATH=$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH

          cd src-tauri
          if [ ! -d "gen/android" ]; then
            echo "Initializing Tauri Android project..."
            tauri android init --ci
          fi

          echo "Building Android APK (target: aarch64, debug-signed for immediate installation)..."
          tauri android build --apk --debug --target aarch64 --ci 2>&1 | tee ../build.log

      - name: Package & Export APK
        if: always()
        run: |
          mkdir -p dist
          APK_RAW=$(find src-tauri/gen/android -name "*.apk" 2>/dev/null | head -n 1 || true)
          if [ -n "$APK_RAW" ] && [ -f "$APK_RAW" ]; then
            echo "✅ Found APK at: $APK_RAW"
            cp "$APK_RAW" dist/MyMusic.apk
            ls -lh dist/MyMusic.apk
            echo "### 🎵 MyMusic Android APK Build Success!" >> $GITHUB_STEP_SUMMARY
            echo "File: \`MyMusic.apk\` ($(du -h dist/MyMusic.apk | cut -f1))" >> $GITHUB_STEP_SUMMARY
            echo "Directly installable on any Android phone (ARM64)." >> $GITHUB_STEP_SUMMARY
          else
            echo "❌ No APK found. Attaching build log excerpt:"
            echo "### ⚠️ Build Log Summary" >> $GITHUB_STEP_SUMMARY
            echo '```text' >> $GITHUB_STEP_SUMMARY
            tail -n 80 build.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || true
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit 1
          fi

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: MyMusic-Android-APK
          path: dist/MyMusic.apk
          if-no-files-found: error
